[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eyetrack"
description = "Real-time eye tracking with OpenCV and MediaPipe FaceMesh"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dynamic = ["version", "dependencies"]

[project.scripts]
eyetrack = "eyetrack.cli:main"

[tool.setuptools.dynamic]
version = { attr = "eyetrack.__version__" }
# requirements.txt holds the exact pins; the package installs the same set.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]
include = ["eyetrack*"]

[tool.setuptools.package-data]
eyetrack = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# dash's pytest plugin conflicts with mediapipe's DLL initialisation on Windows
addopts = "-p no:dash"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/old_work", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.coverage.run]
source_pkgs = ["eyetrack"]
